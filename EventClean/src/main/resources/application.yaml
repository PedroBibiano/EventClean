spring:
  application:
    name: EventClean

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/EventClean
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
