<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Eventos</title>
    <!-- Tailwind CSS via CDN para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="h-full">
<div class="min-height-screen p-4 sm:p-6 lg:p-8 max-w-7xl mx-auto">

    <!-- Cabeçalho Principal -->
    <header class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-gray-200 pb-5">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">EventClean</h1>
            <p class="mt-2 text-sm text-gray-500">Gerenciamento simplificado de eventos locais com Clean Architecture.</p>
        </div>

        <!-- Abas de Navegação (Tabs) -->
        <nav class="-mb-px flex space-x-8" aria-label="Tabs">
            <button id="tab-list" onclick="changeTab('list')" class="border-indigo-500 text-indigo-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition-colors">
                Visualizar Eventos
                <span id="event-count" class="hidden bg-indigo-100 text-indigo-600 ml-1 py-0.5 px-2.5 rounded-full text-xs font-medium">0</span>
            </button>
            <button id="tab-create" onclick="changeTab('create')" class="border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm flex items-center gap-2 transition-colors">
                Cadastrar Novo
            </button>
        </nav>
    </header>

    <main>
        <!-- ABA: LISTAGEM DE EVENTOS -->
        <section id="content-list" class="tab-content active">
            <!-- Estado Vazio (Sem eventos) -->
            <div id="empty-state" class="hidden text-center py-12 bg-white rounded-xl border border-gray-200 shadow-sm">
                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10l4 4v10a2 2 0 01-2 2zM14 2v4a1 1 0 001 1h4" />
                </svg>
                <h3 class="mt-2 text-sm font-medium text-gray-900">Nenhum evento encontrado</h3>
                <p class="mt-1 text-sm text-gray-500">Comece criando um novo evento na aba de cadastro.</p>
            </div>

            <!-- Grid onde os Cards serão injetados -->
            <div id="events-grid" class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
                <!-- Injetado dinamicamente via JS/TS -->
            </div>
        </section>

        <!-- ABA: FORMULÁRIO DE CADASTRO -->
        <section id="content-create" class="tab-content bg-white rounded-xl shadow-sm border border-gray-200 p-6 max-w-2xl mx-auto">
            <form id="eventoForm" class="space-y-6">
                <div class="grid grid-cols-1 gap-y-6 gap-x-4 sm:grid-cols-6">

                    <div class="sm:col-span-4">
                        <label for="nome" class="block text-sm font-medium text-gray-700">Nome do Evento</label>
                        <input type="text" id="nome" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>

                    <div class="sm:col-span-2">
                        <label for="identificador" class="block text-sm font-medium text-gray-700">Identificador Único</label>
                        <input type="text" id="identificador" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>

                    <div class="sm:col-span-6">
                        <label for="descricao" class="block text-sm font-medium text-gray-700">Descrição</label>
                        <textarea id="descricao" rows="3" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border"></textarea>
                    </div>

                    <div class="sm:col-span-3">
                        <label for="dataInicio" class="block text-sm font-medium text-gray-700">Data e Hora de Início</label>
                        <input type="datetime-local" id="dataInicio" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>

                    <div class="sm:col-span-3">
                        <label for="dataFim" class="block text-sm font-medium text-gray-700">Data e Hora de Término</label>
                        <input type="datetime-local" id="dataFim" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>

                    <div class="sm:col-span-3">
                        <label for="organizador" class="block text-sm font-medium text-gray-700">Organizador</label>
                        <input type="text" id="organizador" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>

                    <div class="sm:col-span-3">
                        <label for="capacidade" class="block text-sm font-medium text-gray-700">Capacidade Máxima</label>
                        <input type="number" id="capacidade" min="1" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>

                    <div class="sm:col-span-2">
                        <label for="tipo" class="block text-sm font-medium text-gray-700">Tipo de Evento</label>
                        <select id="tipo" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                            <option value="SHOW">Show</option>
                            <option value="CONGRESSO">Congresso</option>
                            <option value="WORKSHOP">Workshop</option>
                            <option value="PALESTRA">Palestra</option>
                        </select>
                    </div>

                    <div class="sm:col-span-4">
                        <label for="localEvento" class="block text-sm font-medium text-gray-700">Local do Evento</label>
                        <input type="text" id="localEvento" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-2 border">
                    </div>
                </div>

                <div class="flex justify-end pt-4 border-t border-gray-100">
                    <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Salvar Evento
                    </button>
                </div>
            </form>
        </section>
    </main>
</div>

<!-- Componente de Notificação Popup (Toast) -->
<div id="toast" class="flex items-center gap-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span id="toast-message">Mensagem</span>
</div>

<!-- Script principal compilado -->
<script src="script.js"></script>
</body>
</html>
